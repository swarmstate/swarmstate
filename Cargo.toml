[package]
name = "swarmstate_core"
version = "0.10.4"
edition = "2021"
description = "Rust core for swarmstate: state & checkpointing backend for multi-agent systems"
license = "MIT"
repository = "https://github.com/swarmstate/swarmstate"
readme = "README.md"

[lib]
name = "_core"
# Mixed maturin layout: Rust sources live under rust/src, Python under python/.
path = "rust/src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
# abi3 (stable ABI, one wheel for Python 3.9+) is the default for normal builds.
# It is intentionally toggleable because the stable ABI is incompatible with
# free-threaded interpreters before 3.14: the cross-compiled manylinux
# free-threaded wheels build with `--no-default-features` to drop it and produce
# a version-specific cp313t wheel instead. Host builds (maturin develop / pip
# install) auto-disable abi3 for free-threaded, so they need no flag.
default = ["abi3"]
abi3 = ["pyo3/abi3-py39"]

[dependencies]
pyo3 = { version = "0.28" }   # 0.29 dropped abi3-py39; see requires-python
rmpv = "1.3"          # msgpack Value model — stable, language-agnostic codec
imbl = "7.0"          # persistent/immutable maps — O(1) structural-sharing snapshots
                      # (maintained fork of `im`, which has been unmaintained since 2021)

[dev-dependencies]
# Enables embedding a Python interpreter for `cargo test`.
pyo3 = { version = "0.28", features = ["auto-initialize"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
