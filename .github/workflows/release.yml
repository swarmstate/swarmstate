name: Release

# Builds cross-platform abi3 wheels + sdist and publishes to PyPI via
# Trusted Publishing (OIDC — no API token stored in the repo).
#
# Trigger:
#   - publishing a GitHub Release  -> build + publish to PyPI
#   - manual "Run workflow"        -> build + publish (after PyPI is configured)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: wheels (${{ matrix.platform.target }} · ${{ matrix.platform.runner }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest, target: x86_64, manylinux: auto }
          - { runner: ubuntu-latest, target: aarch64, manylinux: auto }
          # Both macOS wheels build on the arm64 runner; x86_64 is
          # cross-compiled to avoid the scarce Intel (macos-13) runners.
          - { runner: macos-14, target: x86_64, manylinux: "" }
          - { runner: macos-14, target: aarch64, manylinux: "" }
          - { runner: windows-latest, target: x64, manylinux: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --out dist
          sccache: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}
          path: dist

  wheels-freethreaded:
    # Free-threaded (no-GIL) CPython does not support the stable ABI, so these
    # are version-specific wheels (separate from the abi3 ones above), one per
    # free-threaded interpreter. The Rust core declares free-threaded support via
    # `m.gil_used(false)`. macOS/Windows build on the host (setup-python provides
    # a real free-threaded build) and maturin auto-drops abi3 for it. Linux is
    # handled separately (wheels-freethreaded-linux) because the manylinux image
    # ships no cp313t.
    name: free-threaded wheels (${{ matrix.python.tag }} · ${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: macos-14, target: aarch64 }
          - { runner: windows-latest, target: x64 }
        python:
          - { version: "3.13t", tag: cp313t }
          - { version: "3.14t", tag: cp314t }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python.version }}
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --interpreter python${{ matrix.python.version }}
          sccache: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-ft-${{ matrix.python.tag }}-${{ matrix.platform.runner }}-${{ matrix.platform.target }}
          path: dist

  wheels-freethreaded-linux:
    # The manylinux_2_28 image ships free-threaded interpreters only for 3.14t+,
    # not cp313t, so an in-container build fails with "Free-threaded Python
    # interpreter is only supported on 3.14 and later". Both are therefore built
    # natively on the host (setup-python provides real free-threaded
    # interpreters) with abi3 disabled (--no-default-features → drops the crate's
    # `abi3` feature), then repaired to a manylinux tag with auditwheel. Runs on
    # a native arm64 runner for aarch64 (no cross-compile needed).
    name: free-threaded wheels (${{ matrix.python.tag }} · linux ${{ matrix.plat.target }})
    runs-on: ${{ matrix.plat.runner }}
    strategy:
      fail-fast: false
      matrix:
        plat:
          - { runner: ubuntu-24.04, target: x86_64 }
          - { runner: ubuntu-24.04-arm, target: aarch64 }
        python:
          - { version: "3.13t", tag: cp313t }
          - { version: "3.14t", tag: cp314t }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python.version }}
      - name: Build (native) + auditwheel repair
        run: |
          python -m pip install --upgrade pip "maturin>=1.7,<2.0" auditwheel
          maturin build --release --out dist_raw \
            --interpreter python${{ matrix.python.version }} --no-default-features
          auditwheel repair dist_raw/*.whl -w dist
          ls -la dist
      - name: Smoke-test the repaired wheel
        run: |
          python -m pip install dist/*.whl
          python -c "import sys, swarmstate as ss; assert sys._is_gil_enabled() is False; s=ss.Store(); s.set('n','k',{'v':1}); assert s.get('n','k')=={'v':1}"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-ft-${{ matrix.python.tag }}-linux-${{ matrix.plat.target }}
          path: dist

  sdist:
    name: source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  publish:
    name: Publish to PyPI
    needs: [wheels, wheels-freethreaded, wheels-freethreaded-linux, sdist]
    runs-on: ubuntu-latest
    # A dedicated environment lets PyPI scope the trusted publisher.
    environment:
      name: pypi
      url: https://pypi.org/project/swarmstate/
    permissions:
      id-token: write # required for OIDC Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
