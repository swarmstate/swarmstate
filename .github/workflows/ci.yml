name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust core (cargo test)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --all --verbose

  python:
    name: Python API (pytest)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps
        run: python -m pip install --upgrade pip pytest
      - name: Build and install swarmstate (maturin backend)
        run: python -m pip install .
      - name: pytest
        run: pytest -q

  freethreaded:
    name: Free-threaded (${{ matrix.python-version }}, no-GIL)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both free-threaded interpreters we publish wheels for.
        python-version: ["3.13t", "3.14t"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install swarmstate + test deps (free-threaded)
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install .
      - name: Confirm the GIL is disabled
        run: python -c "import sys; assert sys._is_gil_enabled() is False"
      - name: pytest (core, batch, free-threaded)
        run: pytest -q tests/test_store.py tests/test_batch.py tests/test_graph.py tests/test_codec.py tests/test_freethreaded.py

  integrations:
    # The adapters depend on LangGraph's API, so both ends of the declared range
    # are tested: the floor in pyproject.toml and whatever is current.
    name: Integrations (LangGraph ${{ matrix.langgraph.name }} · Redis · CrewAI)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        langgraph:
          - { name: "latest", spec: "" }
          - { name: "0.2 (declared floor)", spec: "langgraph==0.2.*" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install swarmstate + extras + test deps
        run: |
          python -m pip install --upgrade pip pytest pytest-cov
          python -m pip install ".[langgraph,redis,otel]" fakeredis
      - name: Pin LangGraph
        if: matrix.langgraph.spec != ''
        run: python -m pip install "${{ matrix.langgraph.spec }}"
      - name: Report the LangGraph version under test
        run: python -c "from importlib.metadata import version; print('langgraph', version('langgraph'))"
      - name: pytest (whole suite, with coverage)
        # Postgres is covered by its own job; the floor here catches a drop in
        # everything else.
        run: pytest -q --cov=swarmstate --cov-report=term-missing --cov-fail-under=80
      - name: Benchmarks still run
        # Not a performance gate — CI runners are too noisy for that. This only
        # keeps the benchmark script from rotting unnoticed.
        if: matrix.langgraph.spec == ''
        run: |
          python -m pip install langgraph-checkpoint-sqlite
          python benchmarks/run.py --iters 200 --warmup 50 --outdir /tmp/bench

  postgres:
    name: Postgres backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install swarmstate + postgres/langgraph extras
        run: |
          python -m pip install --upgrade pip pytest fakeredis
          python -m pip install ".[postgres,langgraph,redis]"
      - name: pytest (Postgres backend + cross-backend contract)
        env:
          SWARMSTATE_TEST_PG_DSN: postgresql://postgres:postgres@localhost:5432/postgres
        run: pytest -q tests/test_postgres.py tests/test_postgres_pool.py tests/test_store_conformance.py

  lint:
    name: Lint (ruff + cargo fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: ruff
        run: |
          python -m pip install --upgrade pip ruff
          ruff check python tests examples benchmarks
          ruff format --check python tests examples
      - name: mypy (strict, own package)
        run: |
          python -m pip install mypy
          mypy
