name: Docs

# Builds the MkDocs Material site (warnings are errors) on every push and PR, and
# publishes it to GitHub Pages from main. The API reference is generated from the
# installed package, so the Rust core is compiled first.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install swarmstate + docs deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[docs]"
      - name: mkdocs build --strict
        run: python -m mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    # Only from main; a PR build stops after verifying the site compiles.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
