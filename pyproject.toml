[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "swarmstate"
version = "0.11.0"
description = "Drop-in state backend for LangGraph, CrewAI & custom agent loops - Rust core, framework-agnostic, built for production."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Jose L. Salmeron" }]
keywords = ["agents", "langgraph", "crewai", "checkpoint", "state", "rust", "multi-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
langgraph = ["langgraph>=0.2"]
crewai = ["crewai>=0.70"]
redis = ["redis>=5.0", "msgpack>=1.0"]
disk = ["msgpack>=1.0"]
postgres = ["psycopg[binary]>=3.1", "psycopg-pool>=3.2", "msgpack>=1.0"]
otel = ["opentelemetry-api>=1.20"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.16,<0.17", "mypy>=2.1,<3"]
bench = ["swarmstate[langgraph,disk]", "langgraph-checkpoint-sqlite>=2.0", "matplotlib>=3.8"]
all = ["swarmstate[langgraph,crewai,redis,disk,postgres,otel]"]

[project.urls]
Homepage = "https://github.com/swarmstate/swarmstate"
Repository = "https://github.com/swarmstate/swarmstate"
Documentation = "https://swarmstate.github.io/"
Changelog = "https://github.com/swarmstate/swarmstate/blob/main/CHANGELOG.md"
Issues = "https://github.com/swarmstate/swarmstate/issues"

[tool.maturin]
python-source = "python"
module-name = "swarmstate._core"
features = ["pyo3/extension-module"]

[tool.ruff]
line-length = 100
target-version = "py39"

# Declared explicitly, not inherited from the defaults: ruff 0.16 widened its
# default rule set, which turned CI red on unchanged code. What "lint" means for
# this project is now a decision recorded here, not a property of whichever ruff
# version CI happened to install.
[tool.ruff.lint]
# Import sorting (I) is deliberately absent: the test suite guards optional
# dependencies with `pytest.importorskip` before importing them, and sorting would
# hoist those imports above the guard.
select = [
    "E4", "E7", "E9",  # pycodestyle errors worth failing on
    "F",               # pyflakes
    "B",               # bugbear: real bug shapes, e.g. closures over loop variables
    "RUF",             # ruff's own checks
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["swarmstate"]
branch = true

[tool.coverage.report]
# `...` bodies are protocol/stub declarations with nothing to execute.
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",
    "except ImportError:",
]

[tool.mypy]
python_version = "3.10"
files = ["python/swarmstate"]
strict = true
# Type-check our own package only; don't descend into third-party trees (their
# stubs target newer Python and pull in numpy/etc.). The compiled Rust module
# and the optional adapters' deps have no stubs we control.
[[tool.mypy.overrides]]
module = [
    "swarmstate._core",
    "langgraph.*",
    "langchain_core.*",
    "redis.*",
    "psycopg.*",
    "psycopg_pool.*",
    "msgpack.*",
    "opentelemetry.*",
    "crewai.*",
]
ignore_missing_imports = true
follow_imports = "skip"
